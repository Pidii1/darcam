<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darcam Island</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
/* Darcam Dynamic Island — hangs from the top edge of the screen (Windows desktop / phone).
   Transparent window: only the island is drawn. */
:root {
    --spring: cubic-bezier(.3, 1.25, .45, 1);
    --ease: cubic-bezier(.2, .8, .2, 1);
    --bg: #000;               /* page 1 */
    --tint: 70, 16, 28;       /* page 2, from the cover */
    --ear: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; overflow: hidden; font-family: Inter, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

.stage { position: fixed; top: 0; left: 50%; transform: translateX(-50%); }

.island {
    --w: 260px; --h: 34px; --r: 18px;
    position: relative; width: var(--w); height: var(--h);
    background: var(--isl-bg, var(--bg));
    border-radius: 0 0 var(--r) var(--r);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    transition: width .55s var(--spring), height .55s var(--spring), border-radius .55s var(--spring), background-color .45s var(--ease);
}
/* concave "ears" that melt into the top edge */
.island::before, .island::after {
    content: ''; position: absolute; top: 0; width: var(--ear); height: var(--ear); pointer-events: none;
    transition: background .45s var(--ease);
}
.island::before { left: calc(var(--ear) * -1); background: radial-gradient(circle at 0 100%, transparent calc(var(--ear) - .5px), var(--isl-bg, var(--bg)) var(--ear)); }
.island::after { right: calc(var(--ear) * -1); background: radial-gradient(circle at 100% 100%, transparent calc(var(--ear) - .5px), var(--isl-bg, var(--bg)) var(--ear)); }

.island.open { --r: 30px; }
.island.open.p1 { --w: 500px; --h: 208px; }
.island.open.p2 { --w: 590px; --h: 208px; --isl-bg: rgb(var(--tint)); }
.island.idle { --w: 150px; }

.clip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
.island.p2.open .clip::before { /* soft light from the cover colour */
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(120% 140% at 0% 0%, rgba(255, 255, 255, .10), transparent 55%), linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, .25));
}

/* ---------- collapsed ---------- */
.mini { position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px 2px 10px; transition: opacity .25s, transform .45s var(--spring); }
.island.open .mini { opacity: 0; transform: scale(.9); pointer-events: none; }
.mini .art { width: 22px; height: 22px; border-radius: 6px; }
.mini-line { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, .85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.island.idle .mini { justify-content: center; }
.idle-mark { display: none; align-items: center; gap: 7px; font-weight: 800; font-size: 12.5px; letter-spacing: -.02em; }
.idle-mark svg { width: 16px; height: 16px; }
.idle-mark b::after { content: '.'; color: #e5243b; }
.island.idle .mini > :not(.idle-mark) { display: none; }
.island.idle .idle-mark { display: flex; }

/* ---------- pages ---------- */
.pages { position: absolute; inset: 0; opacity: 0; transition: opacity .25s; pointer-events: none; }
.island.open .pages { opacity: 1; pointer-events: auto; transition: opacity .3s .12s; }
.page { position: absolute; inset: 0; padding: 18px 24px 0; transition: opacity .3s var(--ease), transform .45s var(--spring); }
.island.p1 .page.two, .island.p2 .page.one { opacity: 0; pointer-events: none; }
.island.p1 .page.two { transform: translateX(30px); }
.island.p2 .page.one { transform: translateX(-30px); }

.art { flex-shrink: 0; background: #2a2a2e center/cover no-repeat; }
.head { display: flex; align-items: center; gap: 14px; min-height: 62px; }
.head .art { width: 62px; height: 62px; border-radius: 12px; box-shadow: 0 6px 16px rgba(0, 0, 0, .35); }
.meta { flex: 1; min-width: 0; }
.title { font-size: 15.5px; font-weight: 700; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist { font-size: 13.5px; font-weight: 500; color: rgba(255, 255, 255, .55); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kline { margin-top: 4px; font-size: 13.5px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; color: rgba(255, 255, 255, .42);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: opacity .25s; }
/* word-by-word fill, so it works when the line wraps */
.kw { transition: color .15s; }
.kw.on { color: #fff; }
.kw.part { background: linear-gradient(90deg, #fff var(--p, 0%), rgba(255, 255, 255, .42) var(--p, 0%)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kline.swap { opacity: 0; }
.kline.dim { color: rgba(255, 255, 255, .6); letter-spacing: .2em; }
.eqi { align-self: flex-start; margin-top: 4px; display: flex; align-items: flex-end; gap: 2.5px; height: 15px; }
.eqi i { width: 3px; height: 15px; border-radius: 1.5px; background: rgba(255, 255, 255, .85); transform-origin: bottom; transform: scaleY(.35); }
.playing .eqi i { animation: eq .9s ease-in-out infinite; }
.playing .eqi i:nth-child(2) { animation-delay: -.35s; animation-duration: .75s; }
.playing .eqi i:nth-child(3) { animation-delay: -.6s; animation-duration: 1.05s; }
.playing .eqi i:nth-child(4) { animation-delay: -.2s; animation-duration: .85s; }
@keyframes eq { 50% { transform: scaleY(1); } }
.mini .eqi { margin: 0; height: 12px; align-self: center; }
.mini .eqi i { height: 12px; width: 2.5px; }

.prog { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, .78); font-variant-numeric: tabular-nums; }
.prog span { min-width: 34px; }
.prog span:last-child { text-align: right; }
.track { position: relative; flex: 1; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .22); cursor: pointer; }
.track::before { content: ''; position: absolute; inset: -8px 0; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; background: #fff; transition: width .25s linear; }

.ctrls { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.ctrls .mid { display: flex; align-items: center; gap: 18px; }
.ib { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, .78); transition: background .2s, color .2s, transform .3s var(--spring); }
.ib:hover { color: #fff; background: rgba(255, 255, 255, .1); }
.ib:active { transform: scale(.86); }
.ib svg { width: 20px; height: 20px; }
.ib.like.on { color: #ff3d6e; }
.ib.skip { color: #fff; } .ib.skip svg { width: 19px; height: 19px; }
.ib.lyr { color: #fff; }
.page.two .ib.lyr { background: #fff; color: #000; }
.head .art { cursor: pointer; }
.play { width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #000; display: inline-flex; align-items: center; justify-content: center; transition: transform .3s var(--spring); }
.play:hover { transform: scale(1.06); } .play:active { transform: scale(.9); }
.play svg { width: 20px; height: 20px; }

/* page 2: player left, lyrics right */
.page.two { display: grid; grid-template-columns: 300px 1px 1fr; column-gap: 22px; padding-right: 26px; }
.page.two .head { min-height: 62px; }
.divider { background: rgba(255, 255, 255, .12); margin: 6px 0 22px; }
.lyrcol { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding-bottom: 18px;
    -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
.lyrs { display: flex; flex-direction: column; gap: 18px; transition: transform .5s var(--spring); }
.lyrs > div { font-size: 14px; line-height: 1.3; font-weight: 650; color: rgba(255, 255, 255, .42); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -.01em; transition: color .4s, transform .4s var(--spring); transform-origin: left center; }
.lyrs > div.cur { -webkit-line-clamp: 4; color: rgba(255, 255, 255, .95); transform: scale(1.02); }
.lyrs > div.cur.k { color: rgba(255, 255, 255, .5); }
.lyrs > div.cur.k .kw.part { background-image: linear-gradient(90deg, #fff var(--p, 0%), rgba(255, 255, 255, .5) var(--p, 0%)); }
.nolyr { font-size: 13px; color: rgba(255, 255, 255, .45); font-weight: 600; }

.dots { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 5px; }
.dots { padding: 4px 6px; }
.dots button { width: 6px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .35); transition: width .3s var(--spring), background .3s; padding: 0; position: relative; }
.dots button::after { content: ''; position: absolute; inset: -7px -5px; }
.dots button.on { width: 14px; background: #fff; }

.island.hidden { --w: 120px; --h: 6px; --r: 6px; opacity: .6; }
.island.hidden > * { display: none; }

/* ================= Android: a floating pill around the front camera =================
   The overlay window is exactly the island's size, placed by the app for each phone. */
body.android .stage { left: 0; top: 0; transform: none; width: 100vw; height: 100vh; }
body.android .island { position: absolute; top: 0; left: var(--x, 0px); width: var(--w); height: var(--h); border-radius: var(--r); box-shadow: none;
    transition: width .5s var(--spring), height .5s var(--spring), left .5s var(--spring), border-radius .5s var(--spring), background-color .45s var(--ease); }
body.android .island::before, body.android .island::after { display: none; }
body.android .mini { padding: 0 10px 0 6px; gap: 8px; }
body.android .mini .art { width: calc(var(--h) - 10px); height: calc(var(--h) - 10px); border-radius: 50%; }
body.android .mini .eqi { margin-left: auto; }
/* camera in the middle of the pill: keep that part empty */
body.android.cam .mini-line { visibility: hidden; }
body.android .page { padding: 16px 18px 0; }
body.android .head { gap: 12px; min-height: 56px; }
body.android .head .art { width: 56px; height: 56px; }
body.android .ctrls .mid { gap: 12px; }
/* page 2 on a phone: lyrics on top, controls under them */
body.android .page.two { display: flex; flex-direction: column; padding: 16px 18px 0; }
body.android .page.two > div:first-child { order: 2; }
body.android .page.two .head { display: none; }
body.android .page.two .divider { display: none; }
body.android .page.two .lyrcol { order: 1; flex: 0 0 104px; padding-bottom: 0; justify-content: flex-start; padding-top: 4px; }
body.android .page.two .prog { margin-top: 6px; }
body.android .page.two .ctrls { margin-top: 4px; }
body.android .lyrs { gap: 12px; }
body.android .lyrs > div { font-size: 15px; }
body.android .lyrs > div.cur { -webkit-line-clamp: 3; }
body.android .dots { bottom: 6px; }
button svg, button * { pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="island idle p1" id="isl">
    <div class="clip">
      <div class="mini">
        <div class="art" data-art></div>
        <div class="mini-line" id="miniLine"></div>
        <div class="eqi"><i></i><i></i><i></i><i></i></div>
        <div class="idle-mark"><svg viewBox="0 0 512 512"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4F93"/><stop offset="1" stop-color="#E5243B"/></linearGradient></defs><path d="M150 128 H262 A128 128 0 0 1 262 384 H150 Z" fill="url(#lg)"/><rect x="225" y="224" width="26" height="64" rx="13"/><rect x="263" y="194" width="26" height="124" rx="13"/><rect x="301" y="212" width="26" height="88" rx="13"/></svg><b>darcam</b></div>
      </div>

      <div class="pages">
        <!-- Page 1: black, karaoke line under the artist -->
        <div class="page one">
          <div class="head">
            <div class="art" data-art></div>
            <div class="meta"><div class="title" data-title></div><div class="artist" data-artist></div><div class="kline" id="kline"></div></div>
            <div class="eqi"><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="prog"><span data-cur>0:00</span><div class="track" data-track><i data-fill></i></div><span data-left>-0:00</span></div>
          <div class="ctrls">
            <button class="ib like" data-c="like" aria-label="Like"></button>
            <div class="mid">
              <button class="ib skip" data-c="prev" aria-label="Previous"></button>
              <button class="play" data-c="toggle" aria-label="Play"></button>
              <button class="ib skip" data-c="next" aria-label="Next"></button>
            </div>
            <button class="ib lyr" data-c="open" aria-label="Show lyrics" title="Lyrics"></button>
          </div>
        </div>

        <!-- Page 2: cover colour, lyrics column on the right -->
        <div class="page two">
          <div>
            <div class="head">
              <div class="art" data-art></div>
              <div class="meta"><div class="title" data-title></div><div class="artist" data-artist></div></div>
            </div>
            <div class="prog"><span data-cur>0:00</span><div class="track" data-track><i data-fill></i></div><span data-left>-0:00</span></div>
            <div class="ctrls">
              <button class="ib like" data-c="like" aria-label="Like"></button>
              <div class="mid">
                <button class="ib skip" data-c="prev" aria-label="Previous"></button>
                <button class="play" data-c="toggle" aria-label="Play"></button>
                <button class="ib skip" data-c="next" aria-label="Next"></button>
              </div>
              <button class="ib lyr" data-c="open" aria-label="Show lyrics" title="Lyrics"></button>
            </div>
          </div>
          <div class="divider"></div>
          <div class="lyrcol"><div class="lyrs" id="lyrs"></div></div>
        </div>
      </div>
    </div>
    <div class="dots" id="dots"><button data-page="1" class="on" aria-label="Page 1"></button><button data-page="2" aria-label="Page 2"></button></div>
  </div>
</div>
<script>
(function () {
    const I = {
        play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9v14.2a1.3 1.3 0 0 0 2 1.1l11-7.1a1.3 1.3 0 0 0 0-2.2l-11-7.1a1.3 1.3 0 0 0-2 1.1z"/></svg>',
        pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.3"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.3"/></svg>',
        prev: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5h2.4v14H5z"/><path d="M19.5 6v12a1.1 1.1 0 0 1-1.7.9L9.3 12.9a1.1 1.1 0 0 1 0-1.8l8.5-6a1.1 1.1 0 0 1 1.7.9z"/></svg>',
        next: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5H19v14h-2.4z"/><path d="M4.5 6v12a1.1 1.1 0 0 0 1.7.9l8.5-6a1.1 1.1 0 0 0 0-1.8l-8.5-6A1.1 1.1 0 0 0 4.5 6z"/></svg>',
        heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20.3 4.6 13a4.9 4.9 0 0 1 0-7 4.9 4.9 0 0 1 7 0l.4.4.4-.4a4.9 4.9 0 0 1 7 0 4.9 4.9 0 0 1 0 7z"/></svg>',
        heartOn: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3 4.6 13a4.9 4.9 0 0 1 0-7 4.9 4.9 0 0 1 7 0l.4.4.4-.4a4.9 4.9 0 0 1 7 0 4.9 4.9 0 0 1 0 7z"/></svg>',
        lyr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h14A2 2 0 0 1 21 6.5v9a2 2 0 0 1-2 2h-8.2l-4.6 3.6a.6.6 0 0 1-1-.5v-3.1H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><path d="M7.5 9.2h9M7.5 12.8h5.5"/></svg>',
    };
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const isl = $('#isl');
    $$('[data-c="prev"]').forEach((b) => (b.innerHTML = I.prev));
    $$('[data-c="next"]').forEach((b) => (b.innerHTML = I.next));
    $$('[data-c="open"]').forEach((b) => (b.innerHTML = I.lyr));

    let S = { has: false }, page = 1, hover = false, pinned = false, hidden = false, lastId = '', lastLine = null;
    try { page = +localStorage.getItem('dci_page') || 1; } catch (e) {}
    const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    const isJava = !!(window.darcamIsland && window.darcamIsland.isAndroid);
    const send = (c) => { try { if (window.darcamIsland) window.darcamIsland.command(isJava ? (typeof c === 'string' ? c : JSON.stringify(c)) : c); } catch (e) {} if (window.parent !== window) window.parent.postMessage({ darcamIsland: c }, '*'); };

    // ---------- Android geometry (from the app) ----------
    let M = null;
    if (isJava) {
        document.body.classList.add('android');
        try { M = JSON.parse(window.darcamIsland.metrics()); } catch (e) { M = null; }
        if (M) document.body.classList.toggle('cam', !!M.centered);
    }
    function placeAndroid(open) {
        if (!M) return;
        const W = window.innerWidth;
        const inOpenWindow = W > M.miniW + 24;
        let x = 0, w = W, h = window.innerHeight, r = M.miniH / 2;
        if (open) { w = W; h = page === 2 ? M.openH2 : M.openH1; r = 30; }
        else if (inOpenWindow) { x = M.miniX - M.openX; w = M.miniW; h = M.miniH; }   // shrinking back towards the camera
        else { h = M.miniH; }
        isl.style.setProperty('--x', x + 'px'); isl.style.setProperty('--w', w + 'px');
        isl.style.setProperty('--h', h + 'px'); isl.style.setProperty('--r', r + 'px');
    }
    window.DarcamIslandMetrics = (m) => { M = m; document.body.classList.toggle('cam', !!(M && M.centered)); placeAndroid(isl.classList.contains('open')); };
    window.addEventListener('resize', () => placeAndroid(isl.classList.contains('open')));
    let openedAt = 0, lastResize = '';

    function layout() {
        const open = S.has && !hidden && (hover || pinned);
        if (open && !isl.classList.contains('open')) openedAt = Date.now();
        placeAndroid(!!open);
        isl.classList.toggle('idle', !S.has);
        isl.classList.toggle('open', !!open);
        isl.classList.toggle('hidden', hidden);
        isl.classList.toggle('p1', page === 1);
        isl.classList.toggle('p2', page === 2);
        isl.classList.toggle('playing', !!S.playing);
        $$('#dots button').forEach((b) => b.classList.toggle('on', +b.dataset.page === page));
        $('#dots').style.display = open ? '' : 'none';
        // tell the app only when the size really changes: re-placing the window on every update
        // cancelled taps on Android (buttons didn't respond) and kept it from shrinking
        try {
            if (window.darcamIsland && window.darcamIsland.resize) {
                const o = { open: !!open, page, idle: !S.has, hidden };
                const key = JSON.stringify(o);
                if (key !== lastResize) { lastResize = key; window.darcamIsland.resize(isJava ? key : o); }
            }
        } catch (e) {}
    }

    function setTint(t) {
        // keep page 2 deep and readable whatever the cover colour is
        const m = (t || '').match(/(\d+)\D+(\d+)\D+(\d+)/);
        let [r, g, b] = m ? [+m[1], +m[2], +m[3]] : [110, 24, 40];
        const max = Math.max(r, g, b) || 1, k = 105 / max;
        r = Math.round(r * k * .78); g = Math.round(g * k * .78); b = Math.round(b * k * .78);
        isl.style.setProperty('--tint', `${r}, ${g}, ${b}`);
    }

    function render(s) {
        const prev = S; S = s || { has: false };
        layout();
        if (!S.has) return;
        if (S.id !== lastId) {
            lastId = S.id;
            $$('[data-art]').forEach((a) => (a.style.backgroundImage = S.cover ? `url("${S.cover}")` : ''));
            setTint(S.tint);
        }
        $$('[data-title]').forEach((e) => (e.textContent = S.title));
        $$('[data-artist]').forEach((e) => (e.textContent = S.artist));
        // swap an icon only when the state changes: rebuilding it on every update made a tap on the
        // play icon land on a node that no longer existed, so play/pause didn't respond
        $$('[data-c="toggle"]').forEach((b) => { const k = S.playing ? 'pause' : 'play'; if (b.dataset.icon !== k) { b.dataset.icon = k; b.innerHTML = I[k]; b.setAttribute('aria-label', S.playing ? 'Pause' : 'Play'); } });
        $$('[data-c="like"]').forEach((b) => { b.classList.toggle('on', !!S.liked); const k = S.liked ? 'heartOn' : 'heart'; if (b.dataset.icon !== k) { b.dataset.icon = k; b.innerHTML = I[k]; } });
        const pct = S.duration ? Math.min(100, (S.position / S.duration) * 100) : 0;
        $$('[data-fill]').forEach((f) => (f.style.width = pct + '%'));
        $$('[data-cur]').forEach((e) => (e.textContent = fmt(S.position)));
        $$('[data-left]').forEach((e) => (e.textContent = '-' + fmt((S.duration || 0) - (S.position || 0))));

        const ly = (S.lyric || '').trim();
        const key = S.id + '|' + ly;
        if (key !== lastLine) {
            lastLine = key;
            // collapsed + page 1 line
            $('#miniLine').textContent = ly && ly !== '♪' ? ly : S.title;
            const k = $('#kline');
            k.classList.add('swap');
            // instrumental parts (intro, solos) only show a note, never the coming line
            setTimeout(() => { if (ly === '♪') k.textContent = '♪ ♪ ♪'; else words(k, ly); k.classList.toggle('dim', ly === '♪'); k.classList.remove('swap'); paint(); }, 160);
            // page 2 column: current line + the next one, sliding up
            const col = $('#lyrs');
            if (!ly && !S.nextLyric) { col.innerHTML = '<div class="nolyr">No lyrics for this song</div>'; }
            else {
                const old = col.querySelector('.cur');
                const same = old && old.textContent === ly;
                if (!same) {
                    col.innerHTML = `<div class="cur ${ly && ly !== '♪' ? 'k' : ''}"></div><div></div>`;
                    if (ly && ly !== '♪') words(col.children[0], ly); else col.children[0].textContent = '♪ ♪ ♪';
                    col.children[1].textContent = ly === '♪' ? '' : (S.nextLyric || '');
                    col.style.transition = 'none'; col.style.transform = 'translateY(24px)';
                    requestAnimationFrame(() => { col.style.transition = ''; col.style.transform = ''; });
                }
            }
        }
        paint();
    }
    function words(el, text) {
        el.innerHTML = '';
        (text || '').split(/(\s+)/).forEach((w) => {
            if (!w) return;
            if (/^\s+$/.test(w)) { el.appendChild(document.createTextNode(w)); return; }
            const sp = document.createElement('span'); sp.className = 'kw'; sp.textContent = w; el.appendChild(sp);
        });
    }
    function paint() {
        const pr = Math.max(0, Math.min(1, S.lyricProgress || 0));
        [$('#kline'), $('#lyrs .cur.k')].forEach((el) => {
            if (!el) return;
            const ws = el.querySelectorAll('.kw'); if (!ws.length) return;
            const f = pr * ws.length, n = Math.floor(f);
            ws.forEach((w, i) => {
                w.classList.toggle('on', i < n);
                const part = i === n && f > n;
                w.classList.toggle('part', part);
                if (part) w.style.setProperty('--p', Math.round((f - n) * 100) + '%');
            });
        });
    }

    // interaction
    // hover to open is for a mouse (Windows). On a phone a tap also fires mouse events,
    // which opened the island under the finger and pressed play/pause — so phones use taps only.
    let leaveT;
    if (!isJava) {
        isl.addEventListener('mouseenter', () => { clearTimeout(leaveT); hover = true; layout(); });
        isl.addEventListener('mouseleave', () => { clearTimeout(leaveT); leaveT = setTimeout(() => { hover = false; layout(); }, 380); });
    }
    isl.addEventListener('click', (e) => {
        // the tap that opened the island must not also press the button that appears under the finger
        if (Date.now() - openedAt < 450 && e.target.closest('[data-c],[data-track],[data-page]')) return;
        const d = e.target.closest('[data-page]');
        if (d) { page = +d.dataset.page; try { localStorage.setItem('dci_page', page); } catch (er) {} layout(); return; }
        const b = e.target.closest('[data-c]');
        if (b) {
            const c = b.dataset.c;
            if (c === 'open') { page = page === 2 ? 1 : 2; try { localStorage.setItem('dci_page', page); } catch (er) {} layout(); return; }
            // say exactly what the button shows (play or pause), not "toggle"
            if (c === 'toggle') { send(S.playing ? 'pause' : 'play'); return; }
            send(c); return;
        }
        if (e.target.closest('.head .art')) { send('open'); return; }
        const tr = e.target.closest('[data-track]');
        if (tr) { const r = tr.getBoundingClientRect(); send({ seek: ((e.clientX - r.left) / r.width) * (S.duration || 0) }); return; }
        if (hidden) { hidden = false; layout(); return; }
        if (!isl.classList.contains('open')) { pinned = true; layout(); }
    });
    // swipe / wheel between pages
    let sx = null;
    isl.addEventListener('pointerdown', (e) => { sx = e.clientX; });
    isl.addEventListener('pointerup', (e) => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 40 && isl.classList.contains('open')) { page = dx < 0 ? 2 : 1; layout(); } });
    let wheelAt = 0;
    isl.addEventListener('wheel', (e) => {
        if (!isl.classList.contains('open')) return;
        const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (Math.abs(d) < 8 || Date.now() - wheelAt < 450) return;
        wheelAt = Date.now();
        page = d > 0 ? 2 : 1; try { localStorage.setItem('dci_page', page); } catch (er) {} layout();
    }, { passive: true });
    document.addEventListener('click', (e) => { if (pinned && !isl.contains(e.target)) { pinned = false; layout(); } });

    // Android: taps outside the overlay collapse it
    window.DarcamIslandOutside = () => { if (pinned) { pinned = false; layout(); } };

    // data in: Electron preload, Android bridge, or postMessage (preview)
    try { window.darcamIsland && window.darcamIsland.onState && window.darcamIsland.onState(render); } catch (e) {}
    window.addEventListener('message', (e) => { if (e.data && e.data.darcamState) render(e.data.darcamState); });
    window.DarcamIslandRender = render;
    window.DarcamIslandSet = (o) => { if (o.hover != null) hover = o.hover; if (o.pinned != null) pinned = o.pinned; if (o.page) page = o.page; if (o.hidden != null) hidden = o.hidden; layout(); };
    render({ has: false });
})();
</script>
</body>
</html>
